name: TMAS Scan

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: Which environment's TMAS_API_KEY secret to use
      scanVuln:
        description: "Scan for vulnerabilities"
        type: boolean
        default: true
      scanSecret:
        description: "Scan for secrets"
        type: boolean
        default: true
  push:

jobs:
  tmas-scan:
    name: TMAS Repo Scan
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ollama-client

      - name: Download TMAS and Scan Repo for Open Source Vulnerabilities and Secrets
        uses: trendmicro/tmas-scan-action@v3.0.1
        with:
          version: "2" # Recommended: pin to major version for automatic updates within v2.x.x
          vulnerabilitiesScan: true
          malwareScan: false
          secretsScan: true
          artifact: dir:./ollama-client
          additionalArgs: ${{ secrets.ADDITIONAL_ARGS }} -vv
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
